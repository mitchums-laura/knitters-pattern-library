<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cozy Edit - Knitting Pattern Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes:wght@400&family=Quicksand:wght@300;400;600;700&family=Arvo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dusty-rose: #D98FA5;
            --mint: #B8D4C8;
            --peach: #F4C5A0;
            --cream: #F5F3EF;
            --gold: #D4A574;
            --charcoal: #3C3C3C;
            --accent-pink: #E8A8B8;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f5f3ef 0%, #f0ebe5 100%);
            background-attachment: fixed;
            color: var(--charcoal);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--dusty-rose);
            font-size: 3em;
            margin-bottom: 10px;
        }

        .tagline {
            color: var(--gold);
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="text"],
        input[type="file"],
        select {
            padding: 12px;
            border: 2px solid var(--dusty-rose);
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1em;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }

        button {
            padding: 12px 20px;
            background: var(--dusty-rose);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s;
        }

        button:hover {
            background: #c97090;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--mint);
            color: var(--charcoal);
        }

        .btn-secondary:hover {
            background: #a3c5b8;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .pattern-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 143, 165, 0.15);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .pattern-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(217, 143, 165, 0.25);
            border-color: var(--dusty-rose);
        }

        .card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--dusty-rose) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dusty-rose);
        }

        .card-designer {
            font-size: 0.85em;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .card-category {
            display: inline-block;
            background: var(--peach);
            color: var(--charcoal);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: var(--dusty-rose);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--cream);
        }

        .tab-btn {
            background: white;
            border: 2px solid var(--dusty-rose);
            color: var(--dusty-rose);
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--dusty-rose);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--charcoal);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--cream);
            border-radius: 6px;
            font-family: 'Quicksand', sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .yarn-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            margin: 0 auto;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gold);
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .copyright {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid var(--cream);
            color: var(--gold);
            font-size: 0.85em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            input[type="text"] {
                max-width: 100%;
            }

            .pattern-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Cozy Edit</h1>
            <p class="tagline">YOUR KNITTING PATTERN LIBRARY</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search patterns...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
            <button onclick="openAddModal()">+ Add Pattern</button>
            <button class="btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <div class="pattern-grid" id="patternGrid">
            <div class="empty-state">
                <div class="empty-state-icon">🧶</div>
                <p>No patterns yet! Click "Add Pattern" to get started.</p>
            </div>
        </div>

        <div class="copyright">
            The Cozy Edit Knitting Planner — Copyright 2026 — Built with 💕
        </div>
    </div>

    <!-- Add/Edit Pattern Modal -->
    <div class="modal" id="patternModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 style="color: var(--dusty-rose); margin-bottom: 20px;">Add New Pattern</h2>
            
            <form onsubmit="savePattern(event)">
                <div class="form-group">
                    <label>Pattern Name *</label>
                    <input type="text" id="patternName" required>
                </div>

                <div class="form-group">
                    <label>Designer</label>
                    <input type="text" id="patternDesigner">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="patternCategory" placeholder="e.g., Socks, Sweater, Shawl">
                </div>

                <div class="form-group">
                    <label>Yardage</label>
                    <input type="text" id="patternYardage" placeholder="e.g., 1200">
                </div>

                <div class="form-group">
                    <label>Needle Size</label>
                    <input type="text" id="patternNeedleSize" placeholder="e.g., US 6">
                </div>

                <div class="form-group">
                    <label>Pattern PDF (optional)</label>
                    <input type="file" id="patternFile" accept=".pdf">
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="patternNotes" placeholder="Personal notes about this pattern..."></textarea>
                </div>

                <button type="submit">Save Pattern</button>
            </form>
        </div>
    </div>

    <!-- Pattern Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDetailsModal()">×</button>
            <h2 id="detailsTitle" style="color: var(--dusty-rose); margin-bottom: 20px;"></h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('overview')">📖 Overview</button>
                <button class="tab-btn" onclick="switchTab('yarn')">🧵 Yarn</button>
                <button class="tab-btn" onclick="switchTab('notes')">📝 Notes</button>
                <button class="tab-btn" onclick="switchTab('progress')">📊 Progress</button>
            </div>

            <!-- Overview Tab -->
            <div id="overview" class="tab-content active">
                <div class="form-group">
                    <label>Designer</label>
                    <p id="showDesigner">—</p>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <p id="showCategory">—</p>
                </div>
                <div class="form-group">
                    <label>Yardage</label>
                    <p id="showYardage">—</p>
                </div>
                <div class="form-group">
                    <label>Needle Size</label>
                    <p id="showNeedleSize">—</p>
                </div>
            </div>

            <!-- Yarn Tab -->
            <div id="yarn" class="tab-content">
                <div class="form-group">
                    <label>Yarn Brand</label>
                    <input type="text" id="editYarnBrand">
                </div>
                <div class="form-group">
                    <label>Weight</label>
                    <input type="text" id="editYarnWeight">
                </div>
                <div class="form-group">
                    <label>Colorway</label>
                    <input type="text" id="editYarnColorway">
                </div>
                <button onclick="saveYarnInfo()">Save Yarn Info</button>
            </div>

            <!-- Notes Tab -->
            <div id="notes" class="tab-content">
                <div class="form-group">
                    <label>Pattern Notes & Worksheet</label>
                    <textarea id="editPatternNotes" style="min-height: 200px;"></textarea>
                </div>
                <button onclick="savePatternNotes()">Save Notes</button>
            </div>

            <!-- Progress Tab -->
            <div id="progress" class="tab-content">
                <div style="text-align: center; padding: 20px;">
                    <div class="yarn-marker">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 70px; height: auto;">
                            <circle cx="50" cy="50" r="35" fill="#D98FA5" opacity="0.95"/>
                            <circle cx="50" cy="50" r="35" fill="none" stroke="#C97090" stroke-width="1.5" opacity="0.6" stroke-dasharray="5,3"/>
                            <ellipse cx="40" cy="35" rx="15" ry="12" fill="#E8A8B8" opacity="0.8"/>
                            <path d="M 75 40 Q 90 35 95 20" stroke="#D98FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M 80 55 Q 100 60 105 75" stroke="#D98FA5" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
                            <path d="M 30 30 Q 50 20 70 30" stroke="#C97090" stroke-width="1" fill="none" opacity="0.5"/>
                            <path d="M 25 50 Q 50 35 75 50" stroke="#C97090" stroke-width="1" fill="none" opacity="0.5"/>
                            <path d="M 30 70 Q 50 80 70 70" stroke="#C97090" stroke-width="1" fill="none" opacity="0.5"/>
                        </svg>
                    </div>
                    <p style="margin-top: 20px; color: var(--gold); font-weight: 600;">Row Counter Coming Soon!</p>
                    <p style="font-size: 0.9em; color: var(--charcoal); margin-top: 10px;">Track your progress with the yarn ball marker in the full version.</p>
                </div>
            </div>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--cream);">
                <button class="btn-secondary" onclick="deletePattern(currentPatternId)" style="width: 100%; background: #ff6b6b; color: white;">Delete Pattern</button>
            </div>
        </div>
    </div>

    <script>
        let patterns = [];
        let currentPatternId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadPatterns();
            setupSearch();
            renderPatterns();
        });

        function loadPatterns() {
            const saved = localStorage.getItem('theCozyEditPatterns');
            patterns = saved ? JSON.parse(saved) : [];
        }

        function savePatterns() {
            localStorage.setItem('theCozyEditPatterns', JSON.stringify(patterns));
        }

        function renderPatterns() {
            const grid = document.getElementById('patternGrid');
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const category = document.getElementById('categoryFilter')?.value || '';

            let filtered = patterns.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || 
                                   (p.designer && p.designer.toLowerCase().includes(search));
                const matchCategory = !category || p.category === category;
                return matchSearch && matchCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧶</div><p>No patterns found. Try adjusting your search!</p></div>';
                return;
            }

            grid.innerHTML = filtered.map((p, i) => `
                <div class="pattern-card" onclick="openDetails('${p.id}')">
                    <div class="card-image" style="background: linear-gradient(135deg, ${['#D4A574', '#B8D4C8', '#F4C5A0'][i % 3]} 0%, ${['#D98FA5', '#A3C5B8', '#E6A87A'][i % 3]} 100%);">
                        🧶
                    </div>
                    <div class="card-content">
                        <div class="card-title">${p.name}</div>
                        ${p.designer ? `<div class="card-designer">by ${p.designer}</div>` : ''}
                        ${p.category ? `<span class="card-category">${p.category}</span>` : ''}
                    </div>
                </div>
            `).join('');

            updateCategoryFilter();
        }

        function updateCategoryFilter() {
            const categories = [...new Set(patterns.map(p => p.category).filter(Boolean))];
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">All Categories</option>' + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function setupSearch() {
            document.getElementById('searchInput')?.addEventListener('input', renderPatterns);
            document.getElementById('categoryFilter')?.addEventListener('change', renderPatterns);
        }

        function openAddModal() {
            document.getElementById('patternModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('patternModal').classList.remove('active');
            document.getElementById('patternName').value = '';
            document.getElementById('patternDesigner').value = '';
            document.getElementById('patternCategory').value = '';
            document.getElementById('patternYardage').value = '';
            document.getElementById('patternNeedleSize').value = '';
            document.getElementById('patternNotes').value = '';
            document.getElementById('patternFile').value = '';
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
            currentPatternId = null;
        }

        function savePattern(e) {
            e.preventDefault();
            
            const pattern = {
                id: Date.now().toString(),
                name: document.getElementById('patternName').value,
                designer: document.getElementById('patternDesigner').value,
                category: document.getElementById('patternCategory').value,
                yardage: document.getElementById('patternYardage').value,
                needleSize: document.getElementById('patternNeedleSize').value,
                notes: document.getElementById('patternNotes').value,
                yarnBrand: '',
                yarnWeight: '',
                yarnColorway: '',
                worksheetNotes: '',
                dateAdded: new Date().toISOString()
            };

            patterns.push(pattern);
            savePatterns();
            renderPatterns();
            closeModal();
        }

        function openDetails(id) {
            currentPatternId = id;
            const pattern = patterns.find(p => p.id === id);
            if (!pattern) return;

            document.getElementById('detailsTitle').textContent = pattern.name;
            document.getElementById('showDesigner').textContent = pattern.designer || '—';
            document.getElementById('showCategory').textContent = pattern.category || '—';
            document.getElementById('showYardage').textContent = pattern.yardage || '—';
            document.getElementById('showNeedleSize').textContent = pattern.needleSize || '—';
            document.getElementById('editYarnBrand').value = pattern.yarnBrand || '';
            document.getElementById('editYarnWeight').value = pattern.yarnWeight || '';
            document.getElementById('editYarnColorway').value = pattern.yarnColorway || '';
            document.getElementById('editPatternNotes').value = pattern.worksheetNotes || '';

            document.getElementById('detailsModal').classList.add('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function saveYarnInfo() {
            const pattern = patterns.find(p => p.id === currentPatternId);
            if (pattern) {
                pattern.yarnBrand = document.getElementById('editYarnBrand').value;
                pattern.yarnWeight = document.getElementById('editYarnWeight').value;
                pattern.yarnColorway = document.getElementById('editYarnColorway').value;
                savePatterns();
                alert('Yarn info saved!');
            }
        }

        function savePatternNotes() {
            const pattern = patterns.find(p => p.id === currentPatternId);
            if (pattern) {
                pattern.worksheetNotes = document.getElementById('editPatternNotes').value;
                savePatterns();
                alert('Notes saved!');
            }
        }

        function deletePattern(id) {
            if (confirm('Are you sure you want to delete this pattern?')) {
                patterns = patterns.filter(p => p.id !== id);
                savePatterns();
                renderPatterns();
                closeDetailsModal();
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            renderPatterns();
        }
    </script>
</body>
</html>
