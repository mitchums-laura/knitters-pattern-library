<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Haven - Knitting Pattern Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes:wght@400&family=Quicksand:wght@300;400;600;700&family=Arvo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dusty-rose: #D98FA5;
            --mint: #B8D4C8;
            --peach: #F4C5A0;
            --cream: #F5F3EF;
            --gold: #D4A574;
            --charcoal: #3C3C3C;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f5f3ef 0%, #f0ebe5 100%);
            color: var(--charcoal);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; }
        h1 { font-family: 'Great Vibes', cursive; color: var(--dusty-rose); font-size: 3em; margin-bottom: 10px; }
        .tagline { color: var(--gold); font-size: 0.9em; font-weight: 600; letter-spacing: 1px; }
        .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        input, select { padding: 12px; border: 2px solid var(--dusty-rose); border-radius: 8px; font-family: 'Quicksand'; font-size: 1em; }
        button { padding: 12px 20px; background: var(--dusty-rose); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        button:hover { background: #c97090; }
        .pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .pattern-card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 143, 165, 0.15); transition: all 0.3s; }
        .pattern-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(217, 143, 165, 0.25); }
        .card-image { width: 100%; height: 180px; background: linear-gradient(135deg, var(--gold) 0%, var(--dusty-rose) 100%); display: flex; align-items: center; justify-content: center; font-size: 3em; }
        .card-content { padding: 15px; }
        .card-title { font-weight: 700; margin-bottom: 8px; color: var(--dusty-rose); }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; padding: 20px; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 2em; cursor: pointer; color: var(--dusty-rose); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 2px solid var(--cream); border-radius: 6px; font-family: 'Quicksand'; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--gold); }
        .empty-state-icon { font-size: 4em; margin-bottom: 20px; }
        .copyright { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--cream); color: var(--gold); font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Pattern Haven</h1>
                    <p class="tagline">YOUR KNITTING PATTERN LIBRARY</p>
                </div>
                <button id="authBtn" style="padding: 10px 20px;">Sign In</button>
            </div>
        </header>

        <div id="appContent" style="display: none;">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search patterns..." style="flex: 1; min-width: 200px; max-width: 300px;">
                <button onclick="openAddModal()">+ Add Pattern</button>
            </div>
            <div class="pattern-grid" id="patternGrid">
                <div class="empty-state">
                    <div class="empty-state-icon">🧶</div>
                    <p>No patterns yet! Click "Add Pattern" to get started.</p>
                </div>
            </div>
        </div>

        <div id="authPrompt" style="text-align: center; padding: 60px 20px;">
            <div style="font-size: 4em; margin-bottom: 20px;">🧶</div>
            <h2 style="color: var(--dusty-rose); margin-bottom: 20px;">Welcome to Pattern Haven</h2>
            <p style="color: var(--charcoal); margin-bottom: 30px; font-size: 1.1em;">Sign in to start organizing your knitting patterns.</p>
            <button onclick="openAuthModal()" style="padding: 15px 40px; font-size: 1.1em;">Get Started</button>
        </div>

        <div class="copyright">Pattern Haven Knitting Planner — Copyright 2026 — Built with 💕</div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="close-btn" onclick="closeAuthModal()">×</button>
            <h2 style="color: var(--dusty-rose); margin-bottom: 20px; text-align: center;" id="authTitle">Sign In</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" required>
                </div>
                <div id="authError" style="color: #ff6b6b; margin-bottom: 15px; display: none;"></div>
                <button type="submit" style="width: 100%; margin-bottom: 15px;">Sign In</button>
            </form>
            <div style="text-align: center; padding: 15px 0; border-top: 2px solid var(--cream);">
                <p style="margin: 0 0 10px 0; color: var(--charcoal);">Don't have an account?</p>
                <button onclick="toggleAuthMode()" style="background: none; border: none; color: var(--dusty-rose); cursor: pointer; text-decoration: underline; font-weight: 600;">Create one here</button>
            </div>
        </div>
    </div>

    <!-- Add Pattern Modal -->
    <div class="modal" id="patternModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 style="color: var(--dusty-rose); margin-bottom: 20px;">Add New Pattern</h2>
            <form onsubmit="savePattern(event)">
                <div class="form-group">
                    <label>Pattern Name *</label>
                    <input type="text" id="patternName" required>
                </div>
                <div class="form-group">
                    <label>Designer</label>
                    <input type="text" id="patternDesigner">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="patternCategory" placeholder="e.g., Socks, Sweater">
                </div>
                <button type="submit">Save Pattern</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, setDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw_La4RvRcCGdoz_U68AtjYBcHJ0tRifI",
            authDomain: "pattern-haven.firebaseapp.com",
            projectId: "pattern-haven",
            storageBucket: "pattern-haven.firebasestorage.app",
            messagingSenderId: "145254566244",
            appId: "1:145254566244:web:651254ce80968e3f50d271"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isSignUpMode = false;
        let patterns = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authPrompt').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('authBtn').textContent = 'Sign Out';
                document.getElementById('authBtn').onclick = () => signOut(auth);
                loadPatterns();
            } else {
                currentUser = null;
                document.getElementById('appContent').style.display = 'none';
                document.getElementById('authPrompt').style.display = 'block';
                document.getElementById('authBtn').textContent = 'Sign In';
                document.getElementById('authBtn').onclick = openAuthModal;
            }
        });

        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                closeAuthModal();
            } catch (error) {
                document.getElementById('authError').textContent = error.message;
                document.getElementById('authError').style.display = 'block';
            }
        };

        window.toggleAuthMode = () => {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').textContent = isSignUpMode ? 'Create Account' : 'Sign In';
        };

        window.loadPatterns = async () => {
            const q = query(collection(db, 'patterns'), where('userId', '==', currentUser.uid));
            const snapshot = await getDocs(q);
            patterns = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderPatterns();
        };

        window.savePattern = async (e) => {
            e.preventDefault();
            const pattern = {
                userId: currentUser.uid,
                name: document.getElementById('patternName').value,
                designer: document.getElementById('patternDesigner').value,
                category: document.getElementById('patternCategory').value,
                dateAdded: new Date().toISOString()
            };
            await setDoc(doc(db, 'patterns', Date.now().toString()), pattern);
            loadPatterns();
            closeModal();
        };

        window.renderPatterns = () => {
            const grid = document.getElementById('patternGrid');
            if (patterns.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧶</div><p>No patterns yet!</p></div>';
                return;
            }
            grid.innerHTML = patterns.map((p, i) => `
                <div class="pattern-card">
                    <div class="card-image" style="background: linear-gradient(135deg, ${['#D4A574', '#B8D4C8', '#F4C5A0'][i % 3]} 0%, ${['#D98FA5', '#A3C5B8', '#E6A87A'][i % 3]} 100%);">🧶</div>
                    <div class="card-content">
                        <div class="card-title">${p.name}</div>
                        ${p.designer ? `<div style="font-size: 0.85em; color: var(--gold);">by ${p.designer}</div>` : ''}
                    </div>
                </div>
            `).join('');
        };

        window.openAuthModal = () => {
            isSignUpMode = false;
            document.getElementById('authTitle').textContent = 'Sign In';
            document.getElementById('authForm').reset();
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authModal').classList.add('active');
        };

        window.closeAuthModal = () => {
            document.getElementById('authModal').classList.remove('active');
        };

        window.openAddModal = () => {
            document.getElementById('patternModal').classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('patternModal').classList.remove('active');
            document.getElementById('patternName').value = '';
            document.getElementById('patternDesigner').value = '';
            document.getElementById('patternCategory').value = '';
        };
    </script>
</body>
</html>
